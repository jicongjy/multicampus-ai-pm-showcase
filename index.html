<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI PM Archive</title>
  <meta name="description" content="멀티캠퍼스 AI 프로덕트 매니저 과정에서 만든 결과물, 노트, 용어를 쌓아 가는 학습 보관함">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="side" id="side" aria-label="메뉴">
      <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span>AI PM Archive</a>
      <nav class="nav" id="nav" aria-label="주 메뉴"></nav>
      <div class="side-foot">
        <a class="profile" id="profile" href="#/"></a>
        <a class="ext" href="https://github.com/jicongjy/pm-archive" target="_blank" rel="noopener noreferrer">깃허브 <span aria-hidden="true">↗</span></a>
      </div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <div class="main" id="main">
      <header class="top">
        <button class="menu-btn" id="menu-btn" type="button" aria-label="메뉴 열기">메뉴</button>
        <a class="top-brand" href="#/"><span class="brand-mark" aria-hidden="true"></span>AI PM Archive</a>
        <nav class="topnav" aria-label="바로가기"><a class="on" href="#/">홈</a><a href="#/weeks">주차</a><a href="#/projects">결과물</a><a href="#/notes">노트</a><a href="#/terms">용어</a><a href="#/links">링크 모음</a></nav>
        <label class="search">
          <span class="sr">검색</span>
          <input id="q" type="search" placeholder="결과물, 노트, 용어, 링크 검색" autocomplete="off">
          <kbd aria-hidden="true">/</kbd>
        </label>
        <p class="today" id="today"></p>
      </header>
      <main class="view" id="view" tabindex="-1">
        <p class="loading">불러오는 중입니다.</p>
      </main>
    </div>
  </div>
  <script src="assets/app.js"></script>
</body>
</html>
