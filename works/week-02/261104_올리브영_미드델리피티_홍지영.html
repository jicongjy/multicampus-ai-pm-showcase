<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>올리브영 온라인몰 프로토타입 (미드피델리티)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#e9e9e9}
body{font-family:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;color:#111;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
button:focus-visible,input:focus-visible{outline:2px solid #111;outline-offset:2px}
.wrap{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:16px;min-height:100vh}
.phone{width:390px;height:min(844px,calc(100vh - 32px));min-height:640px;border:1px solid #111;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#fff;flex:none}
.scr{display:flex;flex-direction:column;flex:1;min-height:0;position:relative}
.hd{height:56px;display:flex;align-items:center;gap:4px;padding:0 4px;border-bottom:1px solid #cfcfcf;flex:none}
.ttl{flex:1;font-size:17px;font-weight:700;padding-left:12px}
.bd{flex:1;min-height:0;overflow-y:auto;position:relative}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.cb{position:absolute;right:4px;top:4px;min-width:16px;height:16px;border-radius:8px;background:#111;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tab{height:64px;display:flex;border-top:1px solid #111;flex:none;background:#fff}
.tab button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:#5c5c5c}
.tab button.on{color:#111;font-weight:700}
.ph{background:#ececec;border:1px solid #cfcfcf;display:flex;align-items:center;justify-content:center;color:#5c5c5c;font-size:11px}
.pad{padding:16px}
.st{font-size:14px;font-weight:700}
.sub{font-size:12px;color:#5c5c5c}
.row{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;border-bottom:1px solid #e4e4e4;font-size:15px;width:100%}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
.card{display:block;width:100%}
.card .b{font-size:12px;color:#5c5c5c;margin-top:8px}
.card .t{font-size:13px;line-height:1.4;height:36px;overflow:hidden}
.card .p{font-size:15px;font-weight:700;margin-top:4px}
.card .r{font-size:12px;color:#5c5c5c;margin-top:2px}
.item{display:flex;gap:12px;padding:16px;border-bottom:1px solid #e4e4e4;width:100%;position:relative}
.item .b{font-size:12px;color:#5c5c5c}
.item .t{font-size:14px;line-height:1.4;margin-top:2px}
.item .p{font-size:16px;font-weight:700;margin-top:6px}
.item .r{font-size:12px;color:#5c5c5c;margin-top:4px}
.ft{padding:12px 16px;border-top:1px solid #111;flex:none;background:#fff}
.cta{height:52px;width:100%;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;font-size:16px;font-weight:700;text-align:center}
.btn2{height:44px;padding:0 14px;border:1px solid #111;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;background:#fff}
.btn2.sm{height:36px}
.btn2.on{background:#111;color:#fff}
.chip{display:flex;align-items:center;gap:4px;height:32px;padding:0 12px;border:1px solid #111;font-size:13px;flex:none;background:#fff}
.chip.on{background:#111;color:#fff}
.fld{height:48px;border:1.5px solid #111;display:flex;align-items:center;padding:0 12px;gap:8px;font-size:14px;flex:1;min-width:0}
.fld.thin{height:44px;border-width:1px}
.fld input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:14px;background:transparent;height:44px;color:#111}
.sec{padding:14px 16px;border-bottom:1px solid #e4e4e4}
.lb{font-size:13px;font-weight:700;margin-bottom:8px}
.opt{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;font-size:14px;width:100%;border:1px solid #bdbdbd}
.opt.sel,.pay.sel{border:1.5px solid #111;background:#f6f6f6;font-weight:700}
.pay{flex:1;height:44px;display:flex;align-items:center;justify-content:center;font-size:13px;text-align:center;border:1px solid #bdbdbd}
.dot{width:16px;height:16px;border-radius:50%;border:1.5px solid #111;flex:none;display:flex;align-items:center;justify-content:center}
.dot.on::after{content:'';width:8px;height:8px;border-radius:50%;background:#111}
.sr{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#444;margin-top:6px}
.sr.big{font-size:16px;font-weight:700;color:#111;margin-top:12px;padding-top:10px;border-top:1px solid #cfcfcf}
.stp{display:flex;align-items:center;border:1px solid #111;height:36px}
.stp span{width:32px;text-align:center;font-size:14px}
.stp button{width:36px;height:34px;display:flex;align-items:center;justify-content:center;font-size:16px}
.err{font-size:12px;font-weight:700;margin-top:6px}
.toast{position:absolute;left:16px;right:16px;bottom:88px;height:44px;background:#111;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:5}
.toast button{color:#fff;font-weight:700}
.hot{outline:2px solid #111;outline-offset:2px}
.item.hot,.row.hot{outline-offset:-3px}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:80px 32px;text-align:center}
.menu{border-bottom:1px solid #cfcfcf;flex:none;background:#fff}
.menu button{display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;font-size:14px;width:100%}
.menu button.on{font-weight:700;background:#f6f6f6}
.panel{width:300px;flex:none;font-size:12px;line-height:1.5;display:flex;flex-direction:column;gap:12px;padding-top:2px}
.panel h2{margin:0;font-size:20px;font-weight:700}
.pth{color:#5c5c5c;padding-bottom:10px;border-bottom:1px solid #cfcfcf}
.sp{display:flex;gap:8px;margin-top:6px}
.n{flex:none;width:18px;height:18px;border-radius:50%;background:#111;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.tip{border:1px solid #111;padding:8px 10px;background:#fff}
.tip b{display:block;margin-bottom:2px}
.stp2{display:flex;align-items:center;gap:8px;margin-top:3px;color:#6b6b6b}
.stp2.vis{color:#111}
.stp2.cur{color:#111;font-weight:700}
.mk{width:18px;height:18px;border-radius:50%;border:1px solid #8a8a8a;display:flex;align-items:center;justify-content:center;font-size:10px;flex:none}
.stp2.vis .mk{border-color:#111}
.stp2.cur .mk{background:#111;color:#fff;border-color:#111}
.pb{height:32px;padding:0 10px;border:1px solid #111;font-size:12px;font-weight:700;display:flex;align-items:center;background:#fff}
@media (max-width:760px){
  .wrap{flex-direction:column;align-items:center}
  .phone{width:100%;max-width:390px}
  .panel{width:100%;max-width:390px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="phone" id="phone" aria-live="polite"></div>
  <aside class="panel" id="panel"></aside>
</div>

<script>
(function () {
  'use strict';

  /* ---------- 샘플 데이터 (흐름 확인용) ---------- */
  var PRODUCTS = [
    { id: 1, cat: '스킨케어', brand: '브랜드 A', name: '수분 세럼', vol: '50ml', price: 18000, rating: '4.8', rev: 1284, opts: ['본품', '기획 세트'] },
    { id: 2, cat: '선케어', brand: '브랜드 B', name: '데일리 선크림', vol: '50ml', price: 22000, rating: '4.7', rev: 532, opts: ['본품', '기획 세트'] },
    { id: 3, cat: '클렌징', brand: '브랜드 C', name: '약산성 클렌징 폼', vol: '150ml', price: 9000, rating: '4.6', rev: 87, opts: ['본품', '2개입'] },
    { id: 4, cat: '메이크업', brand: '브랜드 D', name: '립밤', vol: '4g', price: 6500, rating: '4.5', rev: 2310, opts: ['본품', '2개입'] },
    { id: 5, cat: '스킨케어', brand: '브랜드 E', name: '토너 패드', vol: '70매', price: 24000, rating: '4.7', rev: 145, opts: ['본품', '리필'] },
    { id: 6, cat: '바디', brand: '브랜드 F', name: '핸드크림', vol: '60ml', price: 8000, rating: '4.4', rev: 66, opts: ['본품', '2개입'] }
  ];
  var CATS = ['스킨케어', '선케어', '클렌징', '메이크업', '바디'];
  var SCREENS = [
    { id: 'home', no: 1, label: '홈 화면', path: '올리브영 온라인몰' },
    { id: 'category', no: 2, label: '카테고리 화면', path: '올리브영 온라인몰 › 카테고리' },
    { id: 'catlist', no: 3, label: '카테고리 상품 목록 화면', path: '올리브영 온라인몰 › 카테고리 › 카테고리 상품 목록' },
    { id: 'search', no: 4, label: '검색 화면', path: '올리브영 온라인몰 › 검색' },
    { id: 'result', no: 5, label: '검색 결과 화면', path: '올리브영 온라인몰 › 검색 › 검색 결과' },
    { id: 'detail', no: 6, label: '상품 상세 화면', path: '올리브영 온라인몰 › 검색 › 검색 결과 › 상품 상세' },
    { id: 'cart', no: 7, label: '장바구니 화면', path: '올리브영 온라인몰 › 장바구니' },
    { id: 'checkout', no: 8, label: '주문/결제 화면', path: '올리브영 온라인몰 › 장바구니 › 주문/결제' },
    { id: 'address', no: 9, label: '배송지 변경 화면', path: '올리브영 온라인몰 › 장바구니 › 주문/결제 › 배송지 변경' },
    { id: 'done', no: 10, label: '주문 완료 화면', path: '올리브영 온라인몰 › 장바구니 › 주문/결제 › 주문 완료' }
  ];
  var SPEC = {
    home: ['검색창에 상품명 입력, 각 화면으로 이동하는 진입점'],
    category: ['상품 분류를 골라 둘러보기', '분류를 선택하면 해당 상품 목록으로 이동'],
    catlist: ['선택한 분류의 상품 목록 표시', '상품을 누르면 상품 상세 화면으로 이동'],
    search: ['검색어 입력', '최근 검색어 표시'],
    result: ['입력한 검색어와 맞는 상품을 찾아 목록으로 표시', '리뷰·가격을 비교해 상품을 선택하면 상품 상세 화면으로 이동', '정렬, 필터', '결과가 없을 때: 같은 화면의 빈 상태로 안내 문구 표시'],
    detail: ['용량, 가격, 리뷰 등 상품 정보 확인', '옵션 선택', '장바구니 담기: 선택한 상품을 사용자의 장바구니에 저장'],
    cart: ['담은 상품의 수량, 상품 금액 확인', '주문 버튼을 누르면 주문/결제 화면으로 이동'],
    checkout: ['쿠폰 적용: 사용 조건을 확인하고 최종 결제 금액을 다시 계산', '포인트 사용 금액 입력: 사용 가능 여부를 확인해 반영', '배송지 확인', '결제 수단 선택, 결제'],
    address: ['새로운 주소 검색하여 입력'],
    done: ['주문번호와 도착 예정일 표시']
  };
  var TIPS = {
    home: '굵은 테두리가 눌러야 할 곳입니다. 검색창을 눌러 보세요.',
    category: '분류 하나를 눌러 해당 상품 목록으로 이동해 보세요.',
    catlist: '상품을 눌러 상세 화면으로 이동해 보세요.',
    search: '‘크림’을 입력해 검색하면 결과 2개, ‘abc’처럼 없는 단어를 입력하면 결과 없음 상태를 볼 수 있습니다.',
    result: '정렬·필터를 바꿔 보고 상품을 눌러 보세요. 상단 검색어를 누르면 다시 검색할 수 있습니다.',
    detail: '리뷰를 펼치고 옵션을 고른 뒤 장바구니에 담아 보세요. 여러 번 담으면 수량이 늘어납니다.',
    cart: '수량을 바꿔 금액 변화를 보세요. 립밤 1개만 담으면 쿠폰 조건(2만원 이상) 미충족을 볼 수 있습니다.',
    checkout: '쿠폰 적용, 포인트 입력(한도 초과 시 오류), 결제 수단 미선택 상태로 결제를 눌러 보세요.',
    address: '주소를 검색하고 하나를 선택한 뒤 상세 주소를 입력해 변경해 보세요.',
    done: '홈으로 가기를 누르면 장바구니가 비워지고 처음 상태로 돌아갑니다.'
  };
  var PAYS = ['신용·체크카드', '간편결제', '계좌이체'];
  var ADDRS = ['서울시 ○○구 ○○로 10', '서울시 ○○구 ○○대로 25', '경기도 ○○시 ○○로 7'];
  var SORTS = [['rec', '추천순'], ['low', '낮은 가격순'], ['high', '높은 가격순'], ['rev', '리뷰 많은 순']];

  /* ---------- 유틸 ---------- */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function num(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function fmt(n) { return num(n) + '원'; }
  function prodOf(id) { return PRODUCTS.filter(function (p) { return p.id === id; })[0]; }
  function svg(path, extra) { return '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ' + (extra || '') + '>' + path + '</svg>'; }
  var I = {
    back: svg('<path d="M15 5l-7 7 7 7"/>'),
    cart: svg('<path d="M3 4h3l2.5 11h9.5l2-8H7"/><circle cx="10" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/>'),
    search: svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'),
    home: svg('<path d="M4 11l8-7 8 7v9H4z"/>'),
    grid: svg('<rect x="4" y="4" width="6.5" height="6.5"/><rect x="13.5" y="4" width="6.5" height="6.5"/><rect x="4" y="13.5" width="6.5" height="6.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5"/>'),
    chev: svg('<path d="M9 5l7 7-7 7"/>'),
    clock: svg('<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>'),
    check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>')
  };

  /* ---------- 상태 ---------- */
  function init(hints) {
    return {
      screen: 'home', hist: [], visited: ['home'], hints: hints,
      query: '', term: '', recent: ['세럼', '선크림'], cat: '스킨케어',
      sortOpen: false, sort: 'rec', filterOpen: false, fLow: false, fRev: false,
      pid: 1, opt: 0, revOpen: false, toast: false,
      cart: [],
      coupon: false, couponMsg: '', pt: '', pay: null, payMsg: '',
      addr: '[샘플] 서울시 ○○구 ○○로 12, 101동 202호',
      aq: '', aSearched: false, aSel: null, adetail: '', aMsg: '',
      orderNo: '', orderEta: ''
    };
  }
  var S = init(true);

  function set(o) { for (var k in o) { S[k] = o[k]; } render(); }
  function go(screen, extra) {
    var visited = S.visited.indexOf(screen) >= 0 ? S.visited : S.visited.concat([screen]);
    var o = { toast: false };
    for (var k in extra) { o[k] = extra[k]; }
    o.screen = screen; o.hist = S.hist.concat([S.screen]); o.visited = visited;
    set(o);
  }
  function tab(screen) {
    var visited = S.visited.indexOf(screen) >= 0 ? S.visited : S.visited.concat([screen]);
    set({ screen: screen, hist: [], toast: false, visited: visited });
  }
  function back() {
    var h = S.hist.slice(); var prev = h.pop() || 'home';
    set({ screen: prev, hist: h, toast: false });
  }
  function submit(text) {
    var t = (text || '').trim(); if (!t) return;
    var recent = [t].concat(S.recent.filter(function (x) { return x !== t; })).slice(0, 5);
    go('result', { term: t, query: t, recent: recent, sortOpen: false, filterOpen: false, sort: 'rec', fLow: false, fRev: false });
  }
  function totals() {
    var sub = 0, count = 0;
    S.cart.forEach(function (c) { var p = prodOf(c.pid); sub += p.price * c.qty; count += c.qty; });
    var ship = sub === 0 ? 0 : (sub >= 30000 ? 0 : 3000);
    var couponOk = sub >= 20000;
    var couponAmt = S.coupon && couponOk ? 3000 : 0;
    var maxPt = Math.max(0, Math.min(2500, sub - couponAmt));
    var ptNum = parseInt(String(S.pt).replace(/[^0-9]/g, ''), 10) || 0;
    var ptErr = ptNum > maxPt;
    var ptUse = ptErr ? 0 : ptNum;
    return { sub: sub, count: count, ship: ship, couponOk: couponOk, couponAmt: couponAmt, maxPt: maxPt, ptErr: ptErr, ptUse: ptUse, fin: sub - couponAmt - ptUse + ship };
  }

  /* ---------- 공통 조각 ---------- */
  function hot(on) { return on && S.hints ? ' hot' : ''; }
  function backBtn() { return '<button type="button" class="ib" data-act="back" aria-label="뒤로">' + I.back + '</button>'; }
  function cartBtn() {
    var n = totals().count;
    return '<button type="button" class="ib" data-act="go" data-a="cart" aria-label="장바구니">' + I.cart + (n ? '<span class="cb">' + n + '</span>' : '') + '</button>';
  }
  function card(p, h) {
    return '<button type="button" class="card' + hot(h) + '" data-act="prod" data-a="' + p.id + '"><div class="ph" style="aspect-ratio:1/1">이미지</div><div class="b">' + esc(p.brand) + '</div><div class="t">' + esc(p.name) + '</div><div class="p">' + fmt(p.price) + '</div><div class="r">★ ' + p.rating + ' (' + p.rev + ')</div></button>';

      '<div><div class="st" style="font-size:12px">이 화면의 IA 기능</div>' + spec + '</div>' +
      '<div class="tip"><b>해 보세요</b>' + TIPS[S.screen] + '</div>' +
      '<div><div class="st" style="font-size:12px;margin-bottom:4px">진행 현황 (✓ = 거쳐 간 화면)</div>' + steps + '</div>' +
      '<div style="display:flex;gap:8px"><button type="button" class="pb" data-act="hints">' + (S.hints ? '클릭 힌트 끄기' : '클릭 힌트 켜기') + '</button><button type="button" class="pb" data-act="reset">처음부터 다시</button></div>' +
      '<div class="sub" style="font-size:11px">상품·가격·쿠폰·포인트·배송비 정책은 흐름 확인용 샘플 데이터입니다.</div>';
  }

  /* ---------- 렌더 ---------- */
  var phone = document.getElementById('phone');
  var panel = document.getElementById('panel');
  var lastScreen = null;
  function render() {
    var ae = document.activeElement, aid = ae && ae.id && phone.contains(ae) ? ae.id : null;
    var ss = aid ? ae.selectionStart : null, se = aid ? ae.selectionEnd : null;
    var bd = phone.querySelector('.bd'); var top = bd ? bd.scrollTop : 0;
    phone.innerHTML = V[S.screen]();
    panel.innerHTML = panelHtml();
    if (S.screen === lastScreen) { var nb = phone.querySelector('.bd'); if (nb) nb.scrollTop = top; }
    lastScreen = S.screen;
    if (aid) { var el = document.getElementById(aid); if (el) { el.focus(); try { el.setSelectionRange(ss, se); } catch (e) {} } }
  }

  /* ---------- 이벤트 ---------- */
  var ACT = {
    go: function (a) { if (a === 'search') { go('search', { query: S.term }); } else { go(a); } },
    tab: function (a) { tab(a); },
    back: function () { back(); },
    cat: function (a) { go('catlist', { cat: a }); },
    prod: function (a) { go('detail', { pid: parseInt(a, 10), opt: 0, revOpen: false }); },
    search: function () { submit(S.query); },
    recent: function (a) { submit(a); },
    delRecent: function (a) { set({ recent: S.recent.filter(function (x) { return x !== a; }) }); },
    clearRecent: function () { set({ recent: [] }); },
    sortToggle: function () { set({ sortOpen: !S.sortOpen, filterOpen: false }); },
    filterToggle: function () { set({ filterOpen: !S.filterOpen, sortOpen: false }); },
    sort: function (a) { set({ sort: a, sortOpen: false }); },
    fLow: function () { set({ fLow: !S.fLow }); },
    fRev: function () { set({ fRev: !S.fRev }); },
    revToggle: function () { set({ revOpen: !S.revOpen }); },
    opt: function (a) { set({ opt: parseInt(a, 10) }); },
    add: function () {
      var cart = S.cart.map(function (x) { return { pid: x.pid, opt: x.opt, qty: x.qty }; });
      var f = cart.filter(function (x) { return x.pid === S.pid && x.opt === S.opt; })[0];
      if (f) { f.qty += 1; } else { cart.push({ pid: S.pid, opt: S.opt, qty: 1 }); }
      set({ cart: cart, toast: true });
    },
    qty: function (a) {
      var p = a.split(':'), i = parseInt(p[0], 10), d = parseInt(p[1], 10);
      var cart = S.cart.map(function (x) { return { pid: x.pid, opt: x.opt, qty: x.qty }; });
      cart[i].qty = Math.max(1, cart[i].qty + d); set({ cart: cart });
    },
    del: function (a) { var i = parseInt(a, 10); set({ cart: S.cart.filter(function (x, k) { return k !== i; }) }); },
    checkout: function () { go('checkout', { couponMsg: '', payMsg: '' }); },
    coupon: function () {
      if (!totals().couponOk) { set({ coupon: false, couponMsg: '사용 조건 미충족: 2만원 이상 주문 시 사용할 수 있습니다.' }); return; }
      set({ coupon: !S.coupon, couponMsg: '' });
    },
    ptAll: function () { set({ pt: String(totals().maxPt) }); },
    pay: function (a) { set({ pay: parseInt(a, 10), payMsg: '' }); },
    order: function () {
      if (S.pay === null) { set({ payMsg: '결제 수단을 선택해 주세요.' }); return; }
      if (totals().ptErr) { set({ payMsg: '포인트 사용 금액을 확인해 주세요.' }); return; }
      var dt = new Date(); dt.setDate(dt.getDate() + 2);
      function pad(n) { return n < 10 ? '0' + n : String(n); }
      var eta = dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
      var no = 'ORD-' + String(Math.floor(10000000 + Math.random() * 89999999));
      go('done', { orderNo: no, orderEta: eta, payMsg: '' });
    },
    toAddr: function () { go('address', { aq: '', aSearched: false, aSel: null, adetail: '', aMsg: '' }); },
    aSearch: function () {
      if (!S.aq.trim()) { set({ aMsg: '주소를 입력해 주세요.', aSearched: false }); return; }
      set({ aSearched: true, aSel: null, aMsg: '' });
    },
    aPick: function (a) { set({ aSel: parseInt(a, 10), aMsg: '' }); },
    aConfirm: function () {
      if (S.aSel === null) { set({ aMsg: '검색 결과에서 주소를 선택해 주세요.' }); return; }
      var text = '[샘플] ' + ADDRS[S.aSel] + (S.adetail.trim() ? ', ' + S.adetail.trim() : '');
      S.addr = text; back();
    },
    finish: function () { S = init(S.hints); render(); },
    reset: function () { S = init(S.hints); render(); },
    hints: function () { set({ hints: !S.hints }); }
  };

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var fn = ACT[t.getAttribute('data-act')];
    if (fn) fn(t.getAttribute('data-a'));
  });
  document.addEventListener('input', function (e) {
    var key = e.target.getAttribute && e.target.getAttribute('data-input');
    if (!key) return;
    S[key] = e.target.value;
    if (key === 'pt') render();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var en = e.target.getAttribute && e.target.getAttribute('data-enter');
    if (en && ACT[en]) { e.preventDefault(); ACT[en](); }
  });

  render();
})();
</script>
</body>
</html>
